name: Docs Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Apps in Toss docs drift
        run: npm run docs:check:strict

      - name: Upload docs freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-freshness-report
          path: artifacts/docs-freshness-report.md
          if-no-files-found: warn
